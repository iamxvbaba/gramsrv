version: 1

instance:
  id: core-local-a

debug:
  addr: 127.0.0.1:6061

public:
  dc: 2
  default_country_code: CN
  advertise:
    ip: 127.0.0.1
    port: 2398
  base_url: https://telesrv.net
  app_scheme: telesrv
  web_base_url: https://weba.telesrv.net

branding:
  product_name: Telesrv
  product_username: telesrv
  desktop_app_name: Telesrv Desktop
  android_app_name: Telesrv Android
  ios_app_name: Telesrv iOS
  macos_app_name: Telesrv macOS
  web_a_app_name: Telesrv Web A
  web_k_app_name: Telesrv Web K
  premium_name: Telesrv Premium
  stars_name: Telesrv Stars

postgres:
  dsn: ${TELESRV_POSTGRES_DSN}

# Shared with admin.local.yaml: Admin writes the server identity, Core watches it.
identity:
  dir: data/identity

redis:
  addr: 127.0.0.1:6399
  password: ${TELESRV_REDIS_PASSWORD}
  db: 0

core_exec:
  addr: 127.0.0.1:2440
  token: ${TELESRV_CORE_EXEC_TOKEN}

file_data:
  resolver: static
  targets:
    - 127.0.0.1:2520
  token: ${TELESRV_FILE_TOKEN}
  timeout: 10s

group_call:
  control_addr: 127.0.0.1:2420
  control_token: ${TELESRV_GROUPCALL_CONTROL_TOKEN}

sfu:
  control:
    token: ${TELESRV_SFU_CONTROL_TOKEN}
    timeout: 5s
  owner:
    ttl: 2m
    heartbeat_interval: 30s
    health_timeout: 1s

turn:
  enabled: false

livestream:
  enabled: false

translation:
  enabled: false

http:
  bot_api_addr: ""
  # Bot API base URL BotFather shows with a token (/newbot, /token); empty shows nothing.
  bot_api_public_url: ""
  admin_api_addr: ""
  public_link_web_addr: 127.0.0.1:2401

outbox:
  lease_timeout: 30s
  outbound_push_timeout: 200ms

media:
  external_media_enable: true
  web_page_preview_enable: true

star_gifts:
  # local preserves the existing same-origin export flow; ton is opt-in.
  export:
    mode: local
