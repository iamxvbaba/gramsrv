name: build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o gramsrv-arm64 ./cmd/telesrv
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build1
          files: gramsrv-arm64
