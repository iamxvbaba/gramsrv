name: telesrv-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: telesrv-postgres-dev
    command:
      - "postgres"
      - "-c"
      - "max_locks_per_transaction=512"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "track_io_timing=on"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telesrv}
      POSTGRES_USER: ${POSTGRES_USER:-telesrv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    ports:
      - "${TELESRV_LOCAL_LISTEN_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telesrv} -d ${POSTGRES_DB:-telesrv}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - telesrv-net

  redis:
    image: redis:7-alpine
    container_name: telesrv-redis-dev
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${TELESRV_LOCAL_LISTEN_IP:-127.0.0.1}:${REDIS_PORT:-6399}:6379"
    volumes:
      - redisdata-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - telesrv-net

  telesrv-file:
    build:
      context: .
      dockerfile: Dockerfile
    image: telesrv:dev
    container_name: telesrv-file-dev
    command: ["telesrv-file", "--config", "/app/configs/docker/file.yaml"]
    env_file:
      - .env
    environment:
      TELESRV_INIT_PROFILE: server,storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2520"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - ./data:/app/data
      - ./configs/docker:/app/configs/docker:ro
    restart: unless-stopped
    networks:
      - telesrv-net

  telesrv-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: telesrv:dev
    container_name: telesrv-core-dev
    command: ["telesrv-core", "--config", "/app/configs/docker/core.yaml"]
    env_file:
      - .env
    environment:
      TELESRV_INIT_PROFILE: server,storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      telesrv-file:
        # core's boot hard-fails (fatal: connect filedata grpc) if file's
        # gRPC port isn't accepting connections yet; service_started only
        # proves the process launched, not that it's listening.
        condition: service_healthy
    ports:
      - "${TELESRV_LISTEN_IP:-0.0.0.0}:${TELESRV_PUBLIC_LINK_PORT:-2401}:2401"
      - "${TELESRV_LISTEN_IP:-0.0.0.0}:${TELESRV_BOT_API_PORT:-8081}:8081"
      - "${TELESRV_LISTEN_IP:-0.0.0.0}:${TELESRV_TURN_UDP_PORT:-12400}:${TELESRV_TURN_UDP_PORT:-12400}/udp"
      - "${TELESRV_LISTEN_IP:-0.0.0.0}:${TELESRV_TURN_RELAY_MIN_PORT:-12500}-${TELESRV_TURN_RELAY_MAX_PORT:-12999}:${TELESRV_TURN_RELAY_MIN_PORT:-12500}-${TELESRV_TURN_RELAY_MAX_PORT:-12999}/udp"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2440"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - ./data:/app/data
      - ./configs/docker:/app/configs/docker:ro
    restart: unless-stopped
    networks:
      - telesrv-net

  telesrv-egress:
    build:
      context: .
      dockerfile: Dockerfile
    image: telesrv:dev
    container_name: telesrv-egress-dev
    command: ["telesrv-egress", "--config", "/app/configs/docker/egress.yaml"]
    env_file:
      - .env
    environment:
      TELESRV_INIT_PROFILE: server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      telesrv-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2510"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - ./configs/docker:/app/configs/docker:ro
    restart: unless-stopped
    networks:
      - telesrv-net

  telesrv-sfu:
    build:
      context: .
      dockerfile: Dockerfile
    image: telesrv:dev
    container_name: telesrv-sfu-dev
    command: ["telesrv-sfu", "--config", "/app/configs/docker/sfu.yaml"]
    env_file:
      - .env
    environment:
      TELESRV_INIT_PROFILE: server
    depends_on:
      redis:
        condition: service_healthy
      telesrv-core:
        # SFU needs core's group-call control interface, and the Postgres
        # schema that only core's boot migrates -- service_started races both.
        condition: service_healthy
    ports:
      - "${TELESRV_LISTEN_IP:-0.0.0.0}:${TELESRV_SFU_UDP_PORT:-12399}:12399/udp"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2450"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - ./configs/docker:/app/configs/docker:ro
    restart: unless-stopped
    networks:
      - telesrv-net

  telesrv-edge:
    build:
      context: .
      dockerfile: Dockerfile
    image: telesrv:dev
    container_name: telesrv-edge-dev
    command: ["telesrv-edge", "--config", "/app/configs/docker/edge.yaml"]
    env_file:
      - .env
    environment:
      TELESRV_INIT_PROFILE: server,storage
    depends_on:
      redis:
        condition: service_healthy
      telesrv-core:
        condition: service_healthy
      telesrv-file:
        condition: service_healthy
      telesrv-egress:
        # egress's ACK-writeback gRPC port isn't guaranteed listening just
        # because the container started -- same race as core/file above.
        condition: service_healthy
    ports:
      - "${TELESRV_LISTEN_IP:-0.0.0.0}:${TELESRV_EDGE_PORT:-2398}:2398"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2398"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - ./data:/app/data
      - ./configs/docker:/app/configs/docker:ro
    restart: unless-stopped
    networks:
      - telesrv-net

  telesrv-admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: telesrv:dev
    container_name: telesrv-admin-dev
    command: ["telesrv-admin", "--config", "/app/configs/docker/admin.yaml"]
    env_file:
      - .env
    environment:
      TELESRV_INIT_PROFILE: server,storage
    depends_on:
      postgres:
        condition: service_healthy
      telesrv-core:
        # Only telesrv-core's boot runs schema migrations; other services
        # query the same tables directly, so they must wait for that to
        # actually finish, not just for the core container to have launched.
        condition: service_healthy
    ports:
      - "${TELESRV_LOCAL_LISTEN_IP:-127.0.0.1}:${TELESRV_ADMIN_UI_PORT:-2600}:2600"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2600"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - ./data:/app/data
      - ./configs/docker:/app/configs/docker:ro
    restart: unless-stopped
    networks:
      - telesrv-net

  telesrv-update:
    build:
      context: .
      dockerfile: Dockerfile
    image: telesrv:dev
    container_name: telesrv-update-dev
    environment:
      TELESRV_INIT_PROFILE: none
    command: ["telesrv-update", "--listen", "0.0.0.0:2402", "--manifest", "/app/data/updates/manifest.json", "--files", "/app/data/updates/files"]
    ports:
      - "${TELESRV_LISTEN_IP:-0.0.0.0}:${TELESRV_UPDATE_PORT:-2402}:2402"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2402"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - ./data/updates:/app/data/updates:ro
    restart: unless-stopped
    networks:
      - telesrv-net

  telesrv-ton:
    build:
      context: .
      dockerfile: Dockerfile
    image: telesrv:dev
    container_name: telesrv-ton-dev
    profiles:
      - ton
    command: ["telesrv-ton", "--config", "/app/configs/docker/ton.yaml"]
    env_file:
      - .env
    environment:
      TELESRV_INIT_PROFILE: server
    depends_on:
      postgres:
        condition: service_healthy
      telesrv-core:
        # Only telesrv-core's boot runs schema migrations; other services
        # query the same tables directly, so they must wait for that to
        # actually finish, not just for the core container to have launched.
        condition: service_healthy
    volumes:
      - ./configs/docker:/app/configs/docker:ro
    restart: unless-stopped
    networks:
      - telesrv-net

networks:
  telesrv-net:
    driver: bridge

volumes:
  pgdata-dev:
  redisdata-dev: