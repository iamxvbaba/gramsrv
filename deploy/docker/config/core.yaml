version: 1

instance:
  id: ${TELESRV_INSTANCE_ID}

debug:
  addr: 127.0.0.1:6061

public:
  dc: 2
  default_country_code: ${TELESRV_DEFAULT_COUNTRY_CODE}
  advertise:
    ip: ${TELESRV_ADVERTISE_IP}
    port: ${TELESRV_ADVERTISE_PORT}
  base_url: ${TELESRV_PUBLIC_BASE_URL}
  app_scheme: ${TELESRV_PUBLIC_APP_SCHEME}
  web_base_url: ${TELESRV_PUBLIC_WEB_BASE_URL}

postgres:
  dsn: ${TELESRV_POSTGRES_DSN}
  max_conns: 32
  min_conns: 8
  counter_recovery_max_conns: 4

redis:
  addr: redis:6379
  password: ${TELESRV_REDIS_PASSWORD}
  db: 0

core_exec:
  addr: 0.0.0.0:2440
  token: ${TELESRV_CORE_EXEC_TOKEN}

file_data:
  resolver: dns
  targets:
    - file:2520
  token: ${TELESRV_FILE_TOKEN}
  timeout: 10s

group_call:
  control_addr: 0.0.0.0:2420
  control_token: ${TELESRV_GROUPCALL_CONTROL_TOKEN}

sfu:
  control:
    token: ${TELESRV_SFU_CONTROL_TOKEN}
    timeout: 5s
  owner:
    ttl: 2m
    heartbeat_interval: 30s
    health_timeout: 1s

auth:
  dev_code: ${TELESRV_DEV_AUTH_CODE}
  phone_delivery: ${TELESRV_PHONE_CODE_DELIVERY_PROVIDER}
  otp_webhook_url: ${TELESRV_OTP_WEBHOOK_URL}
  otp_webhook_secret: ${TELESRV_OTP_WEBHOOK_SECRET}
  otp_webhook_timeout: ${TELESRV_OTP_WEBHOOK_TIMEOUT}

turn:
  enabled: ${TELESRV_TURN_ENABLE}
  udp_port: ${TELESRV_TURN_UDP_PORT}
  advertise_ip: "${TELESRV_TURN_ADVERTISE_IP}"
  secret: "${TELESRV_TURN_SECRET}"
  relay_min_port: ${TELESRV_TURN_RELAY_MIN_PORT}
  relay_max_port: ${TELESRV_TURN_RELAY_MAX_PORT}
  credential_ttl: ${TELESRV_CALL_TURN_CREDENTIAL_TTL}
  force_relay: ${TELESRV_CALL_FORCE_RELAY}

livestream:
  enabled: ${TELESRV_LIVESTREAM_ENABLE}
  rtmp_addr: "0.0.0.0:${TELESRV_LIVESTREAM_RTMP_PORT}"
  rtmp_url: "${TELESRV_LIVESTREAM_RTMP_URL}"
  ffmpeg_path: ffmpeg
  work_dir: /var/tmp/telesrv-core/livestream
  segment_keep: 32

translation:
  enabled: false

http:
  bot_api_addr: ""
  admin_api_addr: ""
  public_link_web_addr: 0.0.0.0:2401

outbox:
  lease_timeout: 30s
  outbound_push_timeout: 200ms

media:
  map_tile_cache_dir: /var/lib/telesrv-core/maptiles
  external_media_enable: ${TELESRV_EXTERNAL_MEDIA_ENABLE}
  web_page_preview_enable: ${TELESRV_WEBPAGE_PREVIEW_ENABLE}

seeds:
  langpack_dir: /usr/share/telesrv/langpack
  official_gifts_dir: /var/lib/telesrv-core/official-gifts
  sticker_dir: /var/lib/telesrv-core/sticker-seed
  gif_dir: /var/lib/telesrv-core/gifs
  premium_promo_dir: /var/lib/telesrv-core/premium-promo

telegram_login:
  enabled: false
  signing_keys_file: /var/lib/telesrv-core/telegram-login/signing-keys.json
  code_keys_file: /var/lib/telesrv-core/telegram-login/code-keys.json
  secret_pepper_file: /var/lib/telesrv-core/telegram-login/client-secret-pepper

star_gifts:
  export:
    mode: local

branding:
  product_name: ${TELESRV_BRAND_PRODUCT_NAME}
  product_username: ${TELESRV_BRAND_PRODUCT_USERNAME}
  desktop_app_name: ${TELESRV_BRAND_DESKTOP_APP_NAME}
  android_app_name: ${TELESRV_BRAND_ANDROID_APP_NAME}
  ios_app_name: ${TELESRV_BRAND_IOS_APP_NAME}
  macos_app_name: ${TELESRV_BRAND_MACOS_APP_NAME}
  web_a_app_name: ${TELESRV_BRAND_WEB_A_APP_NAME}
  web_k_app_name: ${TELESRV_BRAND_WEB_K_APP_NAME}
  premium_name: ${TELESRV_BRAND_PREMIUM_NAME}
  stars_name: ${TELESRV_BRAND_STARS_NAME}

storage:
  blob_backend: ${TELESRV_BLOB_BACKEND}
