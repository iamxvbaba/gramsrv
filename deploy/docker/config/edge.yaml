version: 1

instance:
  id: ${TELESRV_INSTANCE_ID}

debug:
  addr: 127.0.0.1:6060

public:
  dc: 2
  default_country_code: ${TELESRV_DEFAULT_COUNTRY_CODE}
  strict_dc_check: false
  advertise:
    ip: ${TELESRV_ADVERTISE_IP}
    port: ${TELESRV_ADVERTISE_PORT}
  base_url: ${TELESRV_PUBLIC_BASE_URL}
  app_scheme: ${TELESRV_PUBLIC_APP_SCHEME}
  web_base_url: ${TELESRV_PUBLIC_WEB_BASE_URL}

redis:
  addr: redis:6379
  password: ${TELESRV_REDIS_PASSWORD}
  db: 0

edge:
  listen: 0.0.0.0:2398
  rsa_key: /var/lib/telesrv-edge/server_rsa.pem
  websocket:
    enabled: true
    allowed_origins:
      - http://localhost:1234
      - http://127.0.0.1:1234
  mtproto:
    outbound_critical_global_max_bytes: 67108864
  location:
    ttl: 90s
    heartbeat_interval: 30s
  auth_key_cache:
    max_entries: 262144
    ttl: 30m
  temp_key_cache:
    max_entries: 262144
    ttl: 30m

# Read-only view of the identity Admin writes; Edge serves it publicly with the
# RSA key at /owpengram/server-info on the MTProto port.
identity:
  dir: /var/lib/telesrv-identity

core_exec:
  resolver: dns
  targets:
    - core:2440
  token: ${TELESRV_CORE_EXEC_TOKEN}
  timeout: 5s

file_data:
  resolver: dns
  targets:
    - file:2520
  token: ${TELESRV_FILE_TOKEN}
  timeout: 10s

egress:
  delivery:
    resolver: dns
    targets:
      - egress:2510
    token: ${TELESRV_EGRESS_DELIVERY_TOKEN}
    timeout: 5s
